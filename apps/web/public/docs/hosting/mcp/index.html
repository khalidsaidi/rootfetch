  <body>
    <main>
      <h1>RootFetch MCP Remote</h1>
      <p>Public read-only MCP endpoint backed by immutable RootFetch run artifacts.</p>
      <p>Streamable HTTP endpoint:</p>
      <pre>/mcp</pre>
      <p>
        Tools:
        <code>rootfetch.latest</code>,
        <code>rootfetch.replay_index</code>,
        <code>rootfetch.run_manifest</code>,
        <code>rootfetch.run_bundle</code>,
        <code>rootfetch.compare_link</code>.
      </p>
      <p>Docs: <a href="https://rootfetch.com/docs/mcp">https://rootfetch.com/docs/mcp</a></p>
    </main>
  </body>
</html>

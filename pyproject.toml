[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "rootfetch"
version = "0.1.0"
description = "Daily CZDS zone trend engine with product signals, MCP server, and RAG utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Khalid Saidi" }
]
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "pyjwt>=2.8.0",
  "pyotp>=2.9.0",
  "pyyaml>=6.0.2",
  "pandas>=2.2.2",
  "hyperloglog>=0.1.5",
  "mcp[cli]>=1.2.0",
  "rapidfuzz>=3.9.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[project.scripts]
rootfetch = "rootfetch.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

name: upstash-bootstrap

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Vercel production env
        run: npx vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inspect env keys
        run: |
          set -euo pipefail
          ENV_FILE=".vercel/.env.production.local"
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "Missing $ENV_FILE after vercel pull"
            exit 1
          fi

          echo "-- ENV KEY NAMES --"
          sed -E 's/=.*$//' "$ENV_FILE" | sort | uniq | sed -n '1,400p'

          URL_VALUE="$(grep -E '^UPSTASH_REDIS_REST_URL=' "$ENV_FILE" | head -n1 | cut -d= -f2- || true)"
          TOKEN_VALUE="$(grep -E '^UPSTASH_REDIS_REST_TOKEN=' "$ENV_FILE" | head -n1 | cut -d= -f2- || true)"
          if [[ -n "$URL_VALUE" ]]; then
            echo "UPSTASH_REDIS_REST_URL=present"
          else
            echo "UPSTASH_REDIS_REST_URL=missing"
          fi
          if [[ -n "$TOKEN_VALUE" ]]; then
            echo "UPSTASH_REDIS_REST_TOKEN=present"
          else
            echo "UPSTASH_REDIS_REST_TOKEN=missing"
          fi

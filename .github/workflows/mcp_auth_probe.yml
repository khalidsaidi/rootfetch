name: mcp-auth-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe MCP auth with GitHub secret token
        run: |
          set -euo pipefail
          TOKEN_SHA="$(python3 - <<'PY'
import hashlib
import os
token=os.environ.get("ROOTFETCH_MCP_TOKEN","")
print(hashlib.sha256(token.encode("utf-8")).hexdigest())
PY
)"
          echo "token_sha256=${TOKEN_SHA}"
          STATUS="$(curl -sS -o /tmp/mcp_body.json -w '%{http_code}' \
            -X POST "https://rootfetch.vercel.app/api/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "Authorization: Bearer ${{ secrets.ROOTFETCH_MCP_TOKEN }}" \
            -H "Origin: https://rootfetch.vercel.app" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gha-probe","version":"1.0.0"}}}')"
          echo "http_status=${STATUS}"
          if [[ "${STATUS}" != "200" ]]; then
            echo "response_body:"
            cat /tmp/mcp_body.json
            exit 1
          fi
          echo "probe_ok=1"
        env:
          ROOTFETCH_MCP_TOKEN: ${{ secrets.ROOTFETCH_MCP_TOKEN }}

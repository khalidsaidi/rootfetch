name: release-check

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Run tests
        run: pytest -q

      - name: Run SDK contract tests
        run: |
          npm --prefix packages/rootfetch-sdk-js test
          python -m pytest -q packages/rootfetch-sdk-py/tests

      - name: MCP smoke
        run: python scripts/smoke_mcp.py

      - name: Build package
        run: python -m build

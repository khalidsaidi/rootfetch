name: rootfetch-daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  run-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CZDS_USERNAME: ${{ secrets.CZDS_USERNAME }}
      CZDS_PASSWORD: ${{ secrets.CZDS_PASSWORD }}
      CZDS_TOTP_SECRET: ${{ secrets.CZDS_TOTP_SECRET }}
      ROOTFETCH_TLD_ALLOWLIST: ${{ vars.ROOTFETCH_TLD_ALLOWLIST }}
      ROOTFETCH_TLD_BLOCKLIST: ${{ vars.ROOTFETCH_TLD_BLOCKLIST }}
      ROOTFETCH_MAX_WORKERS: ${{ vars.ROOTFETCH_MAX_WORKERS }}
      ROOTFETCH_COUNT_MODE: ${{ vars.ROOTFETCH_COUNT_MODE }}
      ROOTFETCH_MIN_BASE_FOR_PCT: ${{ vars.ROOTFETCH_MIN_BASE_FOR_PCT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run RootFetch Daily
        run: rootfetch run-daily

      - name: Commit safe outputs
        run: |
          TODAY="$(date -u +%F)"
          git config user.name "rootfetch-bot"
          git config user.email "rootfetch-bot@users.noreply.github.com"

          git add "data/daily_counts/${TODAY}.csv" || true
          git add "data/approved_tlds/${TODAY}.json" || true
          git add "data/digests/${TODAY}.md" data/digests/latest.md || true
          git add data/growth_trends.csv || true
          git add data/signals/*.csv data/signals/latest.json || true

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "RootFetch daily update ${TODAY}"
          git push

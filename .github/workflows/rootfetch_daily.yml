name: rootfetch-daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  run-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CZDS_USERNAME: ${{ secrets.CZDS_USERNAME }}
      CZDS_PASSWORD: ${{ secrets.CZDS_PASSWORD }}
      CZDS_TOTP_SECRET: ${{ secrets.CZDS_TOTP_SECRET }}
      ROOTFETCH_TLD_ALLOWLIST: ${{ vars.ROOTFETCH_TLD_ALLOWLIST }}
      ROOTFETCH_TLD_BLOCKLIST: ${{ vars.ROOTFETCH_TLD_BLOCKLIST }}
      ROOTFETCH_MAX_WORKERS: ${{ vars.ROOTFETCH_MAX_WORKERS }}
      ROOTFETCH_HTTP_TIMEOUT: ${{ vars.ROOTFETCH_HTTP_TIMEOUT }}
      ROOTFETCH_RETRY_MAX: ${{ vars.ROOTFETCH_RETRY_MAX }}
      ROOTFETCH_COUNT_MODE: ${{ vars.ROOTFETCH_COUNT_MODE }}
      ROOTFETCH_MIN_BASE_FOR_PCT: ${{ vars.ROOTFETCH_MIN_BASE_FOR_PCT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full local hybrid pipeline
        run: |
          chmod +x ./scripts/local_run_hybrid.sh
          ./scripts/local_run_hybrid.sh

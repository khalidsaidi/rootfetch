name: vercel-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "data/**"
      - ".github/workflows/vercel_deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Check Vercel configuration
        id: vercel_config
        run: |
          if [[ -z "${{ secrets.VERCEL_TOKEN }}" || -z "${{ secrets.VERCEL_ORG_ID }}" || -z "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are missing; skipping deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required runtime secrets
        if: steps.vercel_config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.ADMIN_DASH_PASS }}" && -z "${{ secrets.ROOTFETCH_MCP_TOKEN }}" ]]; then
            echo "::error::Missing admin password secret (set ADMIN_DASH_PASS or ROOTFETCH_MCP_TOKEN)"
            exit 1
          fi

      - name: Install web dependencies
        if: steps.vercel_config.outputs.ready == 'true'
        run: npm ci

      - name: Sync RootFetch artifacts into web public/
        if: steps.vercel_config.outputs.ready == 'true'
        run: npm run sync-data

      - name: Pull Vercel environment
        if: steps.vercel_config.outputs.ready == 'true'
        run: npx vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Sync MCP token into Vercel production env
        if: steps.vercel_config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npx vercel@latest env rm ROOTFETCH_MCP_TOKEN production --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
          printf '%s' "${{ secrets.ROOTFETCH_MCP_TOKEN }}" \
            | npx vercel@latest env add ROOTFETCH_MCP_TOKEN production --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Sync admin + telemetry env into Vercel production + preview
        if: steps.vercel_config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ADMIN_USER="${{ vars.ADMIN_DASH_USER }}"
          if [[ -z "${ADMIN_USER}" ]]; then
            ADMIN_USER="admin"
          fi
          ADMIN_PASS_VALUE="${{ secrets.ADMIN_DASH_PASS }}"
          if [[ -z "${ADMIN_PASS_VALUE}" ]]; then
            ADMIN_PASS_VALUE="${{ secrets.ROOTFETCH_MCP_TOKEN }}"
          fi
          for TARGET in production preview; do
            npx vercel@latest env rm ADMIN_DASH_USER "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            printf '%s' "${ADMIN_USER}" \
              | npx vercel@latest env add ADMIN_DASH_USER "${TARGET}" --token "${{ secrets.VERCEL_TOKEN }}"

            npx vercel@latest env rm ADMIN_DASH_PASS "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            printf '%s' "${ADMIN_PASS_VALUE}" \
              | npx vercel@latest env add ADMIN_DASH_PASS "${TARGET}" --token "${{ secrets.VERCEL_TOKEN }}"

            npx vercel@latest env rm UPSTASH_REDIS_REST_URL "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            npx vercel@latest env rm UPSTASH_REDIS_REST_TOKEN "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            npx vercel@latest env rm ROOTFETCH_MCP_TELEMETRY_MODE "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            printf '%s' "shared_preferred" \
              | npx vercel@latest env add ROOTFETCH_MCP_TELEMETRY_MODE "${TARGET}" --token "${{ secrets.VERCEL_TOKEN }}"
          done
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Refresh local Vercel env after MCP sync
        if: steps.vercel_config.outputs.ready == 'true'
        run: npx vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Resolve public env values
        if: steps.vercel_config.outputs.ready == 'true'
        id: public_env
        run: |
          set -euo pipefail
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [[ -z "${SITE_URL}" ]]; then
            SITE_URL="https://rootfetch.vercel.app"
          fi

          GA_ID="${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}"
          if [[ -z "${GA_ID}" ]]; then
            GA_ID="$(
              python3 -c 'import json,pathlib; p=pathlib.Path("../../data/config/ga4.json"); print(((json.loads(p.read_text(encoding="utf-8")).get("measurement_id") or "").strip()) if p.exists() else "")' 2>/dev/null || true
            )"
          fi

          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "ga_id=${GA_ID}" >> "$GITHUB_OUTPUT"

      - name: Sync public env vars into Vercel production + preview
        if: steps.vercel_config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for TARGET in production preview; do
            npx vercel@latest env rm NEXT_PUBLIC_SITE_URL "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
            printf '%s' "${{ steps.public_env.outputs.site_url }}" \
              | npx vercel@latest env add NEXT_PUBLIC_SITE_URL "${TARGET}" --token "${{ secrets.VERCEL_TOKEN }}"

            if [[ -n "${{ steps.public_env.outputs.ga_id }}" ]]; then
              npx vercel@latest env rm NEXT_PUBLIC_GA_MEASUREMENT_ID "${TARGET}" --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
              printf '%s' "${{ steps.public_env.outputs.ga_id }}" \
                | npx vercel@latest env add NEXT_PUBLIC_GA_MEASUREMENT_ID "${TARGET}" --token "${{ secrets.VERCEL_TOKEN }}"
            fi
          done
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy project
        if: steps.vercel_config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ADMIN_PASS_VALUE="${{ secrets.ADMIN_DASH_PASS }}"
          if [[ -z "${ADMIN_PASS_VALUE}" ]]; then
            ADMIN_PASS_VALUE="${{ secrets.ROOTFETCH_MCP_TOKEN }}"
          fi
          DEPLOY_ARGS=(
            --yes
            --prod
            --token "${{ secrets.VERCEL_TOKEN }}"
            --build-env ROOTFETCH_MCP_TOKEN="${{ secrets.ROOTFETCH_MCP_TOKEN }}"
            --env ROOTFETCH_MCP_TOKEN="${{ secrets.ROOTFETCH_MCP_TOKEN }}"
            --build-env ROOTFETCH_MCP_ALLOWED_ORIGINS="${{ vars.ROOTFETCH_MCP_ALLOWED_ORIGINS }}"
            --env ROOTFETCH_MCP_ALLOWED_ORIGINS="${{ vars.ROOTFETCH_MCP_ALLOWED_ORIGINS }}"
            --build-env ADMIN_DASH_USER="${{ vars.ADMIN_DASH_USER }}"
            --env ADMIN_DASH_USER="${{ vars.ADMIN_DASH_USER }}"
            --build-env ADMIN_DASH_PASS="${ADMIN_PASS_VALUE}"
            --env ADMIN_DASH_PASS="${ADMIN_PASS_VALUE}"
            --build-env NEXT_PUBLIC_SITE_URL="${{ steps.public_env.outputs.site_url }}"
            --env NEXT_PUBLIC_SITE_URL="${{ steps.public_env.outputs.site_url }}"
            --build-env NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ steps.public_env.outputs.ga_id }}"
            --env NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ steps.public_env.outputs.ga_id }}"
            --build-env ROOTFETCH_MCP_TELEMETRY_MODE="shared_preferred"
            --env ROOTFETCH_MCP_TELEMETRY_MODE="shared_preferred"
          )
          npx vercel@latest deploy "${DEPLOY_ARGS[@]}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment skipped
        if: steps.vercel_config.outputs.ready != 'true'
        run: echo "No Vercel secrets configured; workflow completed without deploy."

name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install package deps
        run: npm --prefix packages/rootfetch-mcp-local install

      - name: Build package
        run: npm --prefix packages/rootfetch-mcp-local run build

      - name: Publish MCP local package (npm trusted publishing / OIDC)
        run: |
          cd packages/rootfetch-mcp-local
          version=$(node -p "require('./package.json').version")
          if npm view "@khalidsaidi/rootfetch-mcp@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
          else
            npm publish --access public
          fi

      # List the new version in the official MCP Registry (registry.modelcontextprotocol.io), which
      # Claude, VS Code and the MCP directories read. GitHub OIDC proves ownership of io.github.khalidsaidi/*.
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          cd packages/rootfetch-mcp-local
          version=$(node -p "require('./package.json').version")
          # A just-published npm version can take a minute to become visible; the registry checks for it.
          for i in $(seq 1 20); do npm view "@khalidsaidi/rootfetch-mcp@$version" version >/dev/null 2>&1 && break; sleep 15; done
          ../../mcp-publisher publish

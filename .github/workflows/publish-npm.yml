name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install package deps
        run: npm --prefix packages/rootfetch-mcp-local install

      - name: Build package
        run: npm --prefix packages/rootfetch-mcp-local run build

      - name: Publish MCP local package (npm trusted publishing / OIDC)
        run: |
          cd packages/rootfetch-mcp-local
          npm publish --access public

name: monitor-freshness

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      force_stale:
        description: "Set true to simulate stale state for workflow testing"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check approved snapshot freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          force_stale="${{ github.event.inputs.force_stale || 'false' }}"
          if [[ "$force_stale" == "true" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=forced_stale_for_test" >> "$GITHUB_OUTPUT"
            echo "latest_date_utc=forced-test" >> "$GITHUB_OUTPUT"
            echo "age_hours=99999" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_file="data/approved_tlds/latest.json"
          if [[ ! -f "$latest_file" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing_latest_json" >> "$GITHUB_OUTPUT"
            echo "latest_date_utc=none" >> "$GITHUB_OUTPUT"
            echo "age_hours=99999" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_date_utc="$(jq -r '.date_utc // ""' "$latest_file")"
          if [[ -z "$latest_date_utc" || "$latest_date_utc" == "null" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing_date_utc" >> "$GITHUB_OUTPUT"
            echo "latest_date_utc=none" >> "$GITHUB_OUTPUT"
            echo "age_hours=99999" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_epoch="$(date -u -d "$latest_date_utc 00:00:00" +%s)"
          now_epoch="$(date -u +%s)"
          age_hours="$(( (now_epoch - latest_epoch) / 3600 ))"

          echo "latest_date_utc=$latest_date_utc" >> "$GITHUB_OUTPUT"
          echo "age_hours=$age_hours" >> "$GITHUB_OUTPUT"

          if (( age_hours > 48 )); then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=age_gt_48h" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reason=fresh" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update stale-ingest issue when >48h
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "RootFetch freshness alert: approved snapshot older than 48h";
            const marker = "<!-- rootfetch-freshness-alert -->";
            const body = [
              marker,
              "RootFetch approved snapshot appears stale.",
              "",
              `- latest_date_utc: ${process.env.LATEST_DATE_UTC}`,
              `- age_hours: ${process.env.AGE_HOURS}`,
              `- reason: ${process.env.REASON}`,
              `- workflow_run: ${process.env.RUN_URL}`,
              "",
              "This is a passive alert issue. It is auto-closed when freshness recovers."
            ].join("\n");

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "ops,freshness"
            });
            const found = existing.find(i => i.title === title || (i.body || "").includes(marker));

            if (found) {
              await github.rest.issues.update({ owner, repo, issue_number: found.number, body, title });
              core.info(`Updated issue #${found.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["ops", "freshness"]
              });
              core.info(`Created issue #${created.data.number}`);
            }
        env:
          LATEST_DATE_UTC: ${{ steps.freshness.outputs.latest_date_utc }}
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          REASON: ${{ steps.freshness.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Auto-close stale-ingest issue when fresh
        if: steps.freshness.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "RootFetch freshness alert: approved snapshot older than 48h";
            const marker = "<!-- rootfetch-freshness-alert -->";
            const comment = [
              "Freshness recovered; auto-closing.",
              "",
              `- latest_date_utc: ${process.env.LATEST_DATE_UTC}`,
              `- age_hours: ${process.env.AGE_HOURS}`,
              `- workflow_run: ${process.env.RUN_URL}`
            ].join("\n");

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "ops,freshness"
            });
            const matches = openIssues.filter(i => i.title === title || (i.body || "").includes(marker));

            for (const issue of matches) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: comment });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              core.info(`Closed issue #${issue.number}`);
            }
        env:
          LATEST_DATE_UTC: ${{ steps.freshness.outputs.latest_date_utc }}
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
